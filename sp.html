<!DOCTYPE html>
<html>
    <head>
        <script src="coi-serviceworker.min.js"></script>
        <script>
function render(text) { render_.innerHTML = text; }

function request_sp(url="https://subsplease.org/rss/?r=1080") {
    render(`requesting ${url}`);
    fetch(url, headers={
        'Accept-Encoding': 'gzip, deflate, br',
        'Accept': '*/*',
        'Connection': 'keep-alive'
    }).then((res) => {
        if (!res.ok) {
            render(`HTTP error! status: ${res.status}`);
        }
        res.text().then((text) => {
            render(text);
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(text, 'text/xml');
            const items = xmlDoc.getElementsByTagName('item');
            const result = [];
            for (let i = 0; i < items.length; i++) {
                const pubDate = items[i].getElementsByTagName('pubDate')[0]?.textContent;
                const title = items[i].getElementsByTagName('title')[0].textContent;
                const link = items[i].getElementsByTagName('link')[0].textContent;
                result.push({ pubDate, title, link });
            }
            render(result.map((x) => {
                return `${x["pubDate"]}> ${x["title"]}: <a href='${x["link"]}'>magnet</a>`;
            }).join('<br>'));
        });
    }).catch((err) => { render.innerHTML = err; });
}

function request_erai() {
    request_sp("https://www.erai-raws.info/episodes/feed/?res=1080p&type=magnet&subs%5B0%5D=us&token=011aa6f07b0290dd4b45e237b47fb999");
}
</script>
    </head>
    <body>
        <button onclick='request_erai();'>erai</button>
        <button onclick='request_sp();'>sp</button>
        <div id='render_'>waiting for js</div>        
        <script>request_sp();</script>
    </body>
    <script>alert(window.crossOriginIsolated);</script>
</html>
